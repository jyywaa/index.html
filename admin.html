<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop - Admin</title><link rel="stylesheet" href="style.css"></head><body>
<div class="sidebar"><h2>🍡 Admin MochiShop</h2>
<div class="active" onclick="showAdmin('adminDashboard',this)">Dashboard</div><div onclick="showAdmin('adminInput',this)">Input Barang</div>
<div onclick="showAdmin('adminView',this)">Data Barang</div><div onclick="showAdmin('adminPesanan',this)">Status Pengiriman</div>
<div onclick="showAdmin('adminLaporan',this)">Laporan</div><div onclick="logout()">Keluar</div></div>
<div class="main">
<div id="adminDashboard"><h2>Dashboard</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div class="card"><h3>Total Barang</h3><h1 id="totalBarang">0</h1></div><div class="card"><h3>Total Stok</h3><h1 id="totalStok">0</h1></div><div class="card"><h3>Pesanan</h3><h1 id="totalPesanan">0</h1></div></div></div>
<div id="adminInput" style="display:none"><h2>Input Barang</h2><div class="card"><input id="namaBarang" placeholder="Nama Barang">
<input id="hargaBarang" type="number" placeholder="Harga"><input id="stokBarang" type="number" placeholder="Stok">
<select id="kategoriBarang"><option>food</option><option>outfit</option></select><button class="btn" onclick="tambahBarang()">Simpan</button></div></div>
<div id="adminView" style="display:none"><h2>Data Barang</h2><div class="card"><table><thead><tr><th>Nama</th><th>Harga</th><th>Stok</th><th>Aksi</th></tr></thead><tbody id="tabelBarang"></tbody></table></div></div>
<div id="adminPesanan" style="display:none"><h2>Status Pengiriman</h2><div class="card"><table><thead><tr><th>No Pesanan</th><th>Pembeli</th><th>Total</th><th>Status</th><th>Ubah</th></tr></thead><tbody id="tabelPesanan"></tbody></table></div></div>
<div id="adminLaporan" style="display:none"><h2>Laporan</h2><div class="card"><label>Jenis:</label><select id="jenisLaporan"><option>harian</option><option>bulanan</option><option>tahunan</option></select>
<label>Tgl Awal:</label><input id="tglAwal" type="date"><label>Tgl Akhir:</label><input id="tglAkhir" type="date">
<button class="btn" onclick="buatLaporan()">Tampilkan</button></div><div class="card"><table><thead><tr><th>Tanggal</th><th>No Pesanan</th><th>Total</th></tr></thead><tbody id="tabelLaporan"></tbody></table></div></div>
</div><script src="script.js"></script><script>refreshAdmin()</script></body></html>
