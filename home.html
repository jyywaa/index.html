<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop - Home</title><style>:root{--pink:#FF4DA6;--pink2:#FFE4F1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);padding-bottom:80px}header{background:var(--pink);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:20px;font-weight:800}.search-wrap{display:flex;padding:12px 16px;background:var(--pink);gap:8px}
.search-wrap input{flex:1;padding:12px;border-radius:25px;border:none}.search-wrap button{background:white;color:var(--pink);border:none;border-radius:25px;padding:0 20px;font-weight:700}
.tabs{display:flex;gap:10px;padding:12px 16px;overflow-x:auto}.tab{padding:10px 18px;background:white;border-radius:25px;color:var(--pink);font-weight:700;text-decoration:none}
.tab.active{background:var(--pink);color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);position:relative;cursor:pointer}
.card img{width:100%;height:160px;object-fit:cover}.badge{position:absolute;background:var(--pink);color:white;font-size:11px;padding:4px 8px;border-radius:10px;margin:8px;font-weight:800}
.info{padding:10px}.price{color:var(--pink);font-weight:800}.old{font-size:12px;text-decoration:line-through;color:#999;margin-left:4px}
.voucher-btn{width:calc(100% - 16px);margin:8px;padding:10px;background:var(--pink);color:white;border:none;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #eee;padding:12px 0}
.nav-item{text-align:center;font-size:13px;color:#888;text-decoration:none;position:relative}.nav-item.active{color:var(--pink);font-weight:800}
.badge-cart{position:absolute;top:-6px;right:8px;background:red;color:white;font-size:10px;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-weight:800;display:none}</style></head>
<body><header><div class="logo">🍡 MochiShop</div><button onclick="logout()" style="background:none;border:none;color:white;font-weight:700">Keluar</button></header>
<div class="search-wrap"><input id="searchInput" placeholder="Cari ayam geprek..."><button onclick="search()">Cari</button></div>
<div class="tabs"><a href="./home.html" class="tab active">Home</a><a href="./food.html" class="tab">MochiFood</a><a href="./outfit.html" class="tab">MochiOutfit</a><a href="./promo.html" class="tab">Promo</a></div>
<div style="background:linear-gradient(90deg,#FF4DA6,#FF8FD9);color:white;padding:14px;text-align:center;border-radius:16px;margin:12px 16px;font-weight:900">🎉 FLASH SALE 9.9 - DISKON UP TO 90% 🎉</div>
<h3 style="padding:0 16px">Rekomendasi Untuk Mochi</h3><div class="grid" id="grid"></div>
<div class="bottom-nav"><a href="./home.html" class="nav-item active">Home</a><a href="./cart.html" class="nav-item">Keranjang<span id="cartBadge" class="badge-cart"></span></a><a href="./account.html" class="nav-item">Akun</a></div>
<script>
const products=[{id:1,nama:"Ayam Geprek",harga:18000,old:22000,diskon:"18% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1606756790138-261d2b800f0b?w=400",kat:"food"},{id:2,nama:"Nasi Goreng",harga:20000,old:24000,diskon:"15% OFF",rating:4.7,img:"https://images.unsplash.com/photo-1604908177453-7462950a6a3b?w=400",kat:"food"},{id:5,nama:"Matcha Latte",harga:22000,diskon:"Promo",rating:4.8,img:"https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=400",kat:"food"},{id:7,nama:"Es Krim Mochi",harga:15000,old:18000,diskon:"B1G1",rating:4.9,img:"https://images.unsplash.com/photo-1563805042-7684c019e1cb?w=400",kat:"food"},{id:9,nama:"Cardigan Pink",harga:120000,old:150000,diskon:"20% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400",kat:"outfit"},{id:10,nama:"Sweater Oversize",harga:135000,diskon:"Terlaris",rating:4.7,img:"https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?w=400",kat:"outfit"}];
let cart=JSON.parse(localStorage.getItem('mochiCart')||'[]');
function render(list){grid.innerHTML=list.map(p=>`<div class="card" onclick="detail(${p.id})"><span class="badge">${p.diskon}</span><img src="${p.img}">
<button class="voucher-btn" onclick="event.stopPropagation();add(${p.id})">Beli dengan Voucher<br>Rp8.389</button>
<div class="info"><div style="font-weight:700">${p.nama}</div><div><span class="price">Rp${p.harga.toLocaleString()}</span> <span class="old">Rp${p.old?.toLocaleString()}</span></div><div>★ ${p.rating}</div></div></div>`).join('')}
function add(id){cart.push(products.find(x=>x.id==id));localStorage.setItem('mochiCart',JSON.stringify(cart));badge()}
function badge(){if(cart.length>0){cartBadge.style.display='flex';cartBadge.innerText=cart.length}else{cartBadge.style.display='none'}}
function detail(id){localStorage.setItem('detail',id);location.href='./detail.html'}
function search(){render(products.filter(p=>p.nama.toLowerCase().includes(searchInput.value.toLowerCase())))}
function logout(){location.href='./index.html'}render(products);badge()
</script></body></html>
