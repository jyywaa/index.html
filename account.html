<title>Akun</title>
<style>
:root{--pink:#FF4DA6;--pink2:#FFE4F1}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);padding-bottom:100px}
header{background:var(--pink);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:20px;font-weight:800}
.profile{display:flex;gap:14px;align-items:center;padding:20px;background:var(--pink);color:white}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid white}
.card{background:white;margin:10px 16px;padding:14px;border-radius:12px}
.menu-grid{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:10px}
.menu-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.icon{width:28px;height:28px;stroke:var(--pink);fill:none;stroke-width:1.8}
.menu-list{display:flex;align-items:center;padding:14px;border-bottom:1px solid #f2f2f2;gap:10px}
.badge{position:absolute;background:red;color:white;font-size:10px;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;font-weight:800;top:-2px;right:calc(50% - 18px)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #eee;padding:12px 0}
.nav-item{text-align:center;font-size:13px;color:#888;text-decoration:none;position:relative}
.nav-item.active{color:var(--pink);font-weight:800}
</style></head>
