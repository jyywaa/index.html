<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keranjang</title><style>:root{--pink:#FF4DA6;--pink2:#FFE4F1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);padding-bottom:80px}header{background:var(--pink);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:20px;font-weight:800}.cart-item{display:flex;gap:12px;background:white;padding:14px;border-radius:18px;margin:12px 16px;align-items:center}
.cart-item img{width:70px;height:70px;border-radius:14px;object-fit:cover}.price{color:var(--pink);font-weight:800;font-size:16px}
.hapus{color:red;border:none;background:none;font-weight:700;cursor:pointer}.total{padding:0 16px;font-size:18px;font-weight:800;margin-top:10px}
.btn{width:calc(100% - 32px);margin:16px;padding:16px;background:var(--pink);color:white;border:none;border-radius:16px;font-weight:800;font-size:16px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #eee;padding:12px 0}
.nav-item{text-align:center;font-size:13px;color:#888;text-decoration:none}.nav-item.active{color:var(--pink);font-weight:800}</style></head>
<body><header><div class="logo">🍡 MochiShop</div><button onclick="logout()" style="background:none;border:none;color:white;font-weight:700">Keluar</button></header>
<div id="cartList"></div><div class="total" id="total"></div><button class="btn" onclick="checkout()">Checkout via MochiPay</button>
<div class="bottom-nav"><a href="./home.html" class="nav-item">Home</a><a href="./cart.html" class="nav-item active">Keranjang</a><a href="./account.html" class="nav-item">Akun</a></div>
<script>let cart=JSON.parse(localStorage.getItem('mochiCart')||'[]');
function render(){if(cart.length==0){cartList.innerHTML="<p style='text-align:center;padding:50px'>Keranjang kosong</p>";total.innerText="";return}
cartList.innerHTML=cart.map((c,i)=>`<div class="cart-item"><img src="${c.img}"><div style="flex:1"><div style="font-weight:700;font-size:16px">${c.nama}</div>
<div class="price">Rp${c.harga.toLocaleString()}</div><button class="hapus" onclick="hapus(${i})">Hapus</button></div></div>`).join('');
total.innerText="Total: Rp"+cart.reduce((a,b)=>a+b.harga,0).toLocaleString()}
function hapus(i){cart.splice(i,1);localStorage.setItem('mochiCart',JSON.stringify(cart));render()}
function checkout(){if(cart.length==0)return alert('Kosong');alert('Checkout berhasil!');cart=[];localStorage.setItem('mochiCart','[]');render()}
function logout(){location.href='./index.html'}render()</script></body></html>
