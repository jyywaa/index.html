<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop - Login</title><style>:root{--pink:#FF4DA6;--pink2:#FFE4F1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.login-box{width:90%;max-width:400px;background:white;padding:30px;border-radius:24px;box-shadow:0 10px 30px rgba(255,77,166,.15);text-align:center}
.login-box h2{color:var(--pink);margin-bottom:20px;font-size:26px;font-weight:800}
.login-box input{width:100%;padding:14px;margin-bottom:14px;border:1px solid #eee;border-radius:14px;font-size:15px}
.btn{width:100%;padding:14px;background:var(--pink);color:white;border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:16px}</style></head>
<body><div class="login-box"><h2>🍡 Login MochiShop</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Masuk</button><p style="text-align:center;margin-top:15px;font-size:12px;color:#666">Admin: <b>meila / meila123</b><br>Customer: <b>customer / 123</b></p></div>
<script>function login(){let u=username.value,p=password.value;if(u=='meila'&&p=='meila123')location.href='./admin.html';else if(u=='customer'&&p=='123')location.href='./home.html';else alert('Salah')}</script></body></html>
