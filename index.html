<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop</title>
<style>
:root{--pink:#FF4DA6;--pink2:#FFE4F1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);padding-bottom:80px}
.page{display:none}.page.active{display:block}
.btn{width:100%;padding:14px;background:var(--pink);color:white;border:none;border-radius:14px;font-weight:800;cursor:pointer}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#333;color:white;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;z-index:999}
.toast.show{opacity:1}
.login-box{width:90%;max-width:400px;margin:100px auto;background:white;padding:30px;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.1)}
.login-box h2{text-align:center;color:var(--pink)}
.welcome{font-size:28px;text-align:center;margin-bottom:8px}
header{background:var(--pink);color:white;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:800}
.search-wrap{display:flex;padding:12px 16px;background:var(--pink);gap:8px}
.search-wrap input{flex:1;padding:12px;border-radius:25px;border:none}
.search-wrap button{background:white;color:var(--pink);border:none;border-radius:25px;padding:0 20px;font-weight:700}
.tabs{display:flex;gap:10px;padding:12px 16px;overflow-x:auto}
.tab{padding:10px 18px;background:white;border-radius:25px;color:var(--pink);font-weight:700;cursor:pointer;white-space:nowrap}
.tab.active{background:var(--pink);color:white}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}
.card-cus{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer;position:relative}
.card-cus img{width:100%;height:160px;object-fit:cover}
.badge{position:absolute;background:var(--pink);color:white;font-size:11px;padding:4px 8px;border-radius:10px;margin:8px;font-weight:800;z-index:2}
.info{padding:10px}.price{color:var(--pink);font-weight:800}
.old{font-size:12px;text-decoration:line-through;color:#999;margin-left:4px}
.card-actions{display:flex;gap:6px;margin-top:6px;align-items:center}
.btn-icon{padding:8px 10px;background:white;color:var(--pink);border:1px solid var(--pink);border-radius:10px;font-size:16px}
.btn-beli{flex:1;padding:8px;background:var(--pink);color:white;border:none;border-radius:10px;font-weight:700}
.btn-back{padding:8px 14px;background:white;color:var(--pink);border:none;border-radius:25px;font-weight:700;position:absolute;top:12px;left:12px;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.1)} /* PINDAH KE ATAS KIRI */
.avatar-sm{width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #ddd;padding:10px 0}
.nav-item{text-align:center;font-size:12px;color:#888;cursor:pointer;position:relative}
.nav-item.active{color:var(--pink);font-weight:800}
.cart-count{position:absolute;top:-6px;right:22%;background:var(--pink);color:white;border-radius:50%;width:18px;height:18px;font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:800} /* PINDAH KE KAN ATAS */
.comment{background:var(--pink2);padding:10px;border-radius:12px;margin-top:8px;font-size:13px;display:flex;align-items:center}
.flash{background:linear-gradient(90deg,#FF4DA6,#FF8FD9);color:white;padding:14px;text-align:center;border-radius:16px;margin:12px 16px;font-weight:900}
.cart-item{display:flex;gap:12px;background:white;padding:12px;border-radius:14px;margin-bottom:10px}
</style>
</head>
<body>
<div id="toast" class="toast"></div>

<div id="loginPage" class="page active">
  <div class="login-box">
    <div class="welcome">Selamat Datang!🍡</div>
    <h2>Login MochiShop</h2>
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button class="btn" onclick="login()">Masuk</button>
    <p style="text-align:center;margin-top:10px;font-size:12px">Admin: meila / meila123 | Customer: customer / 123</p>
  </div>
</div>

<div id="customerPage" class="page">
<header><div class="logo">🍡 MochiShop</div><button onclick="logout()" style="background:none;border:none;color:white;font-weight:700">Keluar</button></header>

<div id="home" class="cus-tab active">
  <div class="search-wrap"><input id="searchInput" placeholder="Cari ayam geprek, cardigan..."><button onclick="search()">Cari</button></div>
  <div class="tabs">
    <div class="tab active" onclick="setCusTab('home',this)">Home</div>
    <div class="tab" onclick="setCusTab('food',this)">MochiFood</div>
    <div class="tab" onclick="setCusTab('outfit',this)">MochiOutfit</div>
    <div class="tab" onclick="setCusTab('promo',this)">Promo</div>
  </div>
  <div class="flash">🎉 FLASH SALE 9.9 - DISKON UP TO 90% 🎉</div>
  <h3 style="padding:0 16px">Rekomendasi Untuk Mochi</h3>
  <div class="grid" id="homeGrid"></div>
</div>

<div id="detail" class="cus-tab" style="display:none;padding:16px;position:relative">
  <button class="btn-back" onclick="back()">← Kembali</button> <!-- UDAH DI ATAS KIRI -->
  <div id="detailContent"></div>
</div>

<div id="cart" class="cus-tab" style="display:none;padding:16px"><h3>Keranjang</h3><div id="cartList"></div><div id="total" style="font-weight:800;margin:10px 0"></div><button class="btn" onclick="checkout()">Checkout via MochiPay</button></div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="navCus('home')">Home</div>
  <div class="nav-item" onclick="navCus('cart')">Keranjang<span class="cart-count" id="cartCount">0</span></div>
  <div class="nav-item" onclick="navCus('account')">Akun</div>
</div>
</div>
<script>
const produkKomentar={
 1:[{nama:"Karina",text:"Pedesnya nampol! Sambalnya enak banget"}],
 2:[{nama:"Ata",text:"Nasi gorengnya gurih, porsi banyak"}],
 5:[{nama:"Carmen",text:"Matchanya creamy, gak kemanisan"}],
 7:[{nama:"Karel",text:"Es krim mochinya lumer, enak!"}],
 9:[{nama:"Sinta",text:"Bahannya lembut tebal bagus banget"}],
 10:[{nama:"Budi",text:"Sweaternya hangat, cocok buat malem"}],
 14:[{nama:"Lia",text:"Jeansnya tebal, jahitannya rapi"}]
};

// LINK GAMBAR UDAH GANTI SEMUA + TAMBAH ?v=2 BIAR GA CACHE
const products=[
{id:1,nama:"Ayam Geprek",harga:18000,old:22000,diskon:"18% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1547496502-ab53995018b9?w=500&v=2",kat:"food",sub:"berat",desc:"Ayam geprek enak pedas gurih mantap! Daging empuk, sambal nampol bikin nagih."},
{id:2,nama:"Nasi Goreng",harga:20000,old:24000,diskon:"15% OFF",rating:4.7,img:"https://images.unsplash.com/photo-1534080564583-6be69077b6f2?w=500&v=2",kat:"food",sub:"berat",desc:"Nasi goreng enak spesial MochiShop. Bumbu meresap, wangi, porsi jumbo + telur & kerupuk"}, 
{id:5,nama:"Matcha Latte",harga:22000,diskon:"Promo",rating:4.8,img:"https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=500&v=2",kat:"food",sub:"minuman",desc:"Matcha latte creamy premium."},
{id:7,nama:"Es Krim Mochi",harga:15000,old:18000,diskon:"B1G1",rating:4.9,img:"https://images.unsplash.com/photo-1495147466023-ac5c588e2e94?w=500&v=2",kat:"food",sub:"dessert",desc:"Es krim isi mochi lembut lumer."},
{id:9,nama:"Cardigan Pink",harga:120000,old:150000,diskon:"20% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1551232864-3f0890e580d9?w=500&v=2",kat:"outfit",sub:"cardigan",desc:"Cardigan bahan lembut, tebal, bagus."}, // INI UDH GAMBAR CARDIGAN PINK BENERAN
{id:10,nama:"Sweater Oversize",harga:135000,diskon:"Terlaris",rating:4.7,img:"https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=500&v=2",kat:"outfit",sub:"sweater",desc:"Sweater oversize bahan fleece tebal hangat."},
{id:14,nama:"Jeans Biru",harga:160000,old:200000,diskon:"20% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1542272604-787c3835535d?w=500&v=2",kat:"outfit",sub:"jeans",desc:"Jeans biru slimfit bahan denim tebal."}];

let cart=JSON.parse(localStorage.getItem('mochiCart')||'[]');

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
function login(){let u=document.getElementById('username').value;let p=document.getElementById('password').value;if(u=='customer' && p=='123'){document.getElementById('loginPage').classList.remove('active');document.getElementById('customerPage').classList.add('active');init()}else toast('Salah')}
function logout(){document.getElementById('customerPage').classList.remove('active');document.getElementById('loginPage').classList.add('active')}

function render(list,target){document.getElementById(target).innerHTML=list.map(p=>`<div class="card-cus" onclick="showDetail(${p.id})"><span class="badge">${p.diskon}</span><img src="${p.img}" onerror="this.src='https://placehold.co/400x400/FF8FD9/FFFFFF?text=${p.nama}'"><div class="info"><div style="font-weight:700">${p.nama}</div><div><span class="price">Rp${p.harga.toLocaleString()}</span> <span class="old">Rp${p.old?.toLocaleString()}</span></div><div>★ ${p.rating}</div><div class="card-actions"><span style="font-size:20px">🛒</span><button class="btn-beli" onclick="event.stopPropagation();addCart(${p.id})">Beli</button></div></div></div>`).join('')} // ICON PISAH

function init(){render(products,'homeGrid');renderCart();updateCount()}
function showDetail(id){const p=products.find(x=>x.id==id);const kom=produkKomentar[id]||[];document.getElementById('detailContent').innerHTML=`<img src="${p.img}?v=2" style="width:100%;border-radius:18px;margin-top:10px"><h2>${p.nama}</h2><p style="color:#555;margin:8px 0">${p.desc}</p><div class="price" style="font-size:20px">Rp${p.harga.toLocaleString()}</div><button class="btn" onclick="addCart(${p.id})">🛒 Beli Sekarang</button><h4 style="margin-top:16px">Komentar Pembeli</h4>${kom.map(k=>`<div class="comment"><img src="https://i.pravatar.cc/32?u=${k.nama}" class="avatar-sm"><b>${k.nama}:</b> ${k.text}</div>`).join('')}`;document.querySelectorAll('.cus-tab').forEach(p=>p.style.display='none');document.getElementById('detail').style.display='block'}
function addCart(id){cart.push(products.find(x=>x.id==id));localStorage.setItem('mochiCart',JSON.stringify(cart));updateCount();toast('Masuk keranjang 🛒');renderCart()}
function renderCart(){if(cart.length==0){document.getElementById('cartList').innerHTML="<p style='text-align:center'>Keranjang kosong</p>";document.getElementById('total').innerText="";return}document.getElementById('cartList').innerHTML=cart.map((c,i)=>`<div class="cart-item"><img src="${c.img}" style="width:70px;height:70px;border-radius:12px"><div><div style="font-weight:700">${c.nama}</div><div class="price">Rp${c.harga.toLocaleString()}</div><button onclick="hapusCart(${i})" style="color:red;border:none;background:none">Hapus</button></div></div>`).join('');document.getElementById('total').innerText="Total: Rp"+cart.reduce((a,b)=>a+b.harga,0).toLocaleString()}
function hapusCart(i){cart.splice(i,1);localStorage.setItem('mochiCart',JSON.stringify(cart));renderCart();updateCount()}
function checkout(){if(cart.length==0)return toast('Keranjang kosong');toast('Checkout berhasil!');cart=[];localStorage.setItem('mochiCart','[]');renderCart();updateCount();navCus('home')}
function updateCount(){document.getElementById('cartCount').innerText=cart.length}
function search(){const q=document.getElementById('searchInput').value.toLowerCase();render(products.filter(p=>p.nama.toLowerCase().includes(q)),'homeGrid')}
function setCusTab(id){document.querySelectorAll('.cus-tab').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block'}
function navCus(p){setCusTab(p);renderCart();updateCount();document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));event.target.classList.add('active')}
function back(){setCusTab('home')}
</script>
</body></html>
