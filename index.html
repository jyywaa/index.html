<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MochiShop - Cute & Modern E-Commerce</title>
  <style>
    /* ==========================================
       1. VARIABLES & RESET
       ========================================== */
    :root {
      --primary: #FF4DA6;
      --secondary: #FF8FD9;
      --bg: #FFE4F1;
      --surface: #FFFFFF;
      --text: #2D2D2D;
      --text-muted: #7D7D7D;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.08);
      padding-bottom: 70px;
    }

    .hidden { display: none !important; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.95); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-outline { border: 2px solid var(--primary); color: var(--primary); background: white; }
    .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 12px; }
    .btn-block { width: 100%; }

    /* ==========================================
       2. TOAST NOTIFICATION (MELAYANG TANPA ALERT/OK)
       ========================================== */
    #toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      width: 90%;
      max-width: 400px;
      pointer-events: none;
    }

    .toast {
      background: #2D2D2D;
      color: white;
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-left: 5px solid var(--primary);
      animation: slideDown 0.3s forwards, fadeOut 0.3s 2.7s forwards;
      font-weight: 600;
      font-size: 13px;
    }

    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }

    /* ==========================================
       3. ONBOARDING OVERLAY
       ========================================== */
    .onboarding-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .onboarding-card {
      background: var(--surface);
      width: 100%;
      max-width: 380px;
      padding: 30px 24px;
      border-radius: 24px;
      text-align: center;
    }

    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 6px; }
    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #FFE4F1;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: #FFF9FC;
    }

    /* ==========================================
       4. HEADER & TOP SEARCH
       ========================================== */
    .sticky-header {
      position: sticky;
      top: 0;
      background: var(--primary);
      color: white;
      padding: 14px 16px;
      z-index: 100;
    }
    .brand-title { font-size: 20px; font-weight: 900; }

    .search-row {
      margin-top: 10px;
      display: flex;
      gap: 8px;
    }
    .search-row input {
      flex-grow: 1;
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      font-size: 13px;
      outline: none;
      background: white;
    }
    .btn-search {
      background: white;
      color: var(--primary);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    /* ==========================================
       5. HOME & PRODUCT GRID
       ========================================== */
    .view-container { padding: 16px; }

    .banner-promo {
      background: linear-gradient(135deg, #FF4DA6, #FF8FD9);
      color: white;
      padding: 16px;
      border-radius: var(--radius);
      margin-bottom: 16px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
    }

    .tab-category {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .tab-chip {
      padding: 10px 20px;
      background: white;
      color: var(--primary);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      border: 1px solid #FFE4F1;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    .section-title { font-size: 16px; font-weight: 900; margin-bottom: 12px; }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid #FFE4F1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .badge-discount {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--primary);
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 10px;
      z-index: 2;
    }
    .product-img-wrap { width: 100%; height: 130px; background: #FFF5F9; cursor: pointer; }
    .product-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { padding: 10px; display: flex; flex-direction: column; flex-grow: 1; }
    .product-title { font-size: 13px; font-weight: 700; margin-bottom: 4px; height: 34px; overflow: hidden; cursor: pointer; }
    .product-price { font-size: 14px; font-weight: 900; color: var(--primary); margin-bottom: 8px; }

    /* Quantity Control di Card (+1 s/d +100) */
    .cart-qty-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #FFE4F1;
      border-radius: 12px;
      padding: 2px;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: none;
      background: var(--primary);
      color: white;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
    .qty-val { font-size: 12px; font-weight: 800; color: var(--primary); }

    /* ==========================================
       6. DETAIL OVERLAY & REVIEWS
       ========================================== */
    .detail-view {
      position: fixed;
      inset: 0;
      background: var(--surface);
      z-index: 200;
      overflow-y: auto;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    .detail-img-container { width: 100%; height: 260px; }
    .detail-img-container img { width: 100%; height: 100%; object-fit: cover; }
    .detail-body { padding: 20px; }
    .review-item { display: flex; gap: 12px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed #FFE4F1; }
    .review-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #FF8FD9; }

    /* ==========================================
       7. BOTTOM NAVIGATION BAR & CART BADGE (+1-100)
       ========================================== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: 65px;
      background: var(--surface);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #FFE4F1;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      background: none;
      border: none;
      cursor: pointer;
      position: relative;
      width: 33.3%;
      gap: 3px;
    }
    .nav-item.active { color: var(--primary); }

    /* Badge Notifikasi Angka di Atas Ikon Keranjang Nav */
    .nav-cart-badge {
      position: absolute;
      top: -4px;
      right: 28%;
      background: #FF3B30;
      color: white;
      font-size: 10px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 10px;
      border: 2px solid white;
    }

    /* Cart Page Items */
    .cart-item {
      display: flex;
      gap: 12px;
      padding: 12px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid #FFE4F1;
      margin-bottom: 12px;
      align-items: center;
    }
    .cart-item img { width: 60px; height: 60px; border-radius: 12px; object-fit: cover; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Toast Melayang (Menggantikan Pop-Up OK Browser) -->
    <div id="toast-container"></div>

    <!-- ONBOARDING OVERLAY -->
    <div id="onboarding" class="onboarding-overlay">
      <div class="onboarding-card">
        <h2 style="color: var(--primary); margin-bottom: 6px;">Selamat Datang! 🍡</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">Masuk ke MochiShop untuk belanja</p>
        <div class="form-group">
          <label>EMAIL</label>
          <input type="email" id="input-email" class="form-control" value="kholifah@email.com">
        </div>
        <div class="form-group">
          <label>USERNAME</label>
          <input type="text" id="input-username" class="form-control" placeholder="customer / kholifah">
        </div>
        <div class="form-group">
          <label>PASSWORD</label>
          <input type="password" id="input-password" class="form-control" placeholder="123 / 1417">
        </div>
        <button class="btn btn-primary btn-block" onclick="handleLogin()">Masuk Sekarang 🎉</button>
      </div>
    </div>

    <!-- HEADER & SEARCH BAR -->
    <header class="sticky-header">
      <div class="flex-between">
        <div class="brand-title">🍡 MochiShop</div>
        <button onclick="logout()" style="background:none; border:none; color:white; font-weight:700; font-size:12px; cursor:pointer;">Keluar</button>
      </div>
      <div class="search-row">
        <input type="text" id="search-input" placeholder="Ayam Geprek, Nasi Goreng, dll..." onkeyup="if(event.key==='Enter') executeSearch()">
        <button class="btn-search" onclick="executeSearch()">Cari</button>
      </div>
    </header>

    <!-- HOME VIEW -->
    <main id="view-home" class="view-container">
      <div class="banner-promo">
        🎉 FLASH SALE 9.9 - DISKON UP TO 90% 🎉
      </div>

      <div class="tab-category">
        <button class="tab-chip active" onclick="switchCategory('all', this)">Home</button>
        <button class="tab-chip" onclick="switchCategory('MochiFood', this)">MochiFood</button>
        <button class="tab-chip" onclick="switchCategory('MochiOutfit', this)">MochiOutfit</button>
      </div>

      <h4 class="section-title">Rekomendasi Untuk Mochi</h4>
      <div id="product-grid" class="product-grid"></div>
    </main>

    <!-- CART VIEW -->
    <main id="view-cart" class="view-container hidden">
      <h4 class="section-title">Keranjang Belanja 🛒</h4>
      <div id="cart-list"></div>
      
      <div style="background: #FFF9FC; padding: 16px; border-radius: 18px; border: 1px dashed var(--secondary); margin-top: 20px;">
        <div class="flex-between" style="font-size: 13px; margin-bottom: 8px;">
          <span>Subtotal</span>
          <span id="cart-subtotal">Rp 0</span>
        </div>
        <div class="flex-between" style="font-size: 13px; margin-bottom: 8px;">
          <span>Ongkos Kirim Flat</span>
          <span>Rp 20.000</span>
        </div>
        <div class="flex-between" style="font-size: 16px; font-weight: 900; color: var(--primary); border-top: 1px solid #FFE4F1; padding-top: 8px;">
          <span>Total Pembayaran</span>
          <span id="cart-total">Rp 0</span>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top: 14px;" onclick="checkoutCart()">Bayar Sekarang 💳</button>
      </div>
    </main>

    <!-- PROFILE VIEW -->
    <main id="view-profile" class="view-container hidden">
      <div style="background: linear-gradient(135deg, #FF8FD9, #FF4DA6); color: white; border-radius: 20px; padding: 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 20px;">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=200" style="width: 50px; height: 50px; border-radius: 50%; border: 2px solid white; object-fit: cover;">
        <div>
          <h3 id="profile-name">kholifah</h3>
          <p id="profile-email" style="font-size: 12px;">kholifah@email.com</p>
          <span style="background: #FFD700; color: #5B4000; font-size: 10px; font-weight: 900; padding: 2px 8px; border-radius: 10px;">VIP Member</span>
        </div>
      </div>
      <button class="btn btn-outline btn-block" style="color: red; border-color: red;" onclick="logout()">Keluar Akun 🚪</button>
    </main>

    <!-- DETAIL PRODUCT OVERLAY -->
    <div id="view-detail" class="detail-view hidden">
      <div style="position: absolute; top: 16px; left: 16px; z-index: 10;">
        <button class="btn" style="background: white; border-radius: 50%; width: 36px; height: 36px; padding: 0;" onclick="closeDetail()">➔</button>
      </div>
      <div class="detail-img-container">
        <img id="detail-img" src="" alt="Detail">
      </div>
      <div class="detail-body">
        <h2 id="detail-title" style="font-size: 20px; font-weight: 800;"></h2>
        <h3 id="detail-price" style="color: var(--primary); font-size: 22px; font-weight: 900; margin: 8px 0;"></h3>
        <p id="detail-desc" style="font-size: 13px; color: #666; line-height: 1.5; margin-bottom: 20px;"></p>

        <h4 class="section-title">Komentar Pembeli ⭐</h4>
        <div id="detail-reviews"></div>
      </div>
    </div>

    <!-- BOTTOM NAVIGATION BAR (IKON KERANJANG DI SINI) -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchTab('home', this)">
        <span style="font-size: 20px;">🏠</span>
        <span>Home</span>
      </button>

      <!-- MENU KERANJANG DENGAN IKON 🛒 DAN BADGE BADGE ANGKANYA (+1 S/D +100) -->
      <button class="nav-item" onclick="switchTab('cart', this)">
        <span style="font-size: 20px;">🛒</span>
        <span>Keranjang</span>
        <span id="nav-cart-badge" class="nav-cart-badge hidden">0</span>
      </button>

      <button class="nav-item" onclick="switchTab('profile', this)">
        <span style="font-size: 20px;">👤</span>
        <span>Akun</span>
      </button>
    </nav>
  </div>

  <script>
    /* DATA PRODUK LENGKAP DENGAN GAMBAR & KOMENTAR AKURAT */
    const initialProducts = [
      {
        id: 1,
        name: "Ayam Geprek",

        discount: "30%",
        img: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&q=80&w=500",
        category: "MochiFood",
        desc: "Ayam geprek crispy bumbu Mochi disiram sambal pedas khas nusantara yang gurih mantap.",
        reviews: [
          { name: "Karina", comment: "Ayamnya gurih bgt, sambel gepreknya nampol!", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=100" },
          { name: "Anisa Fitri", comment: "Porsi kenyang, pedasnya pas sesuai selera.", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=100" }
        ]
      },
      {
        id: 2,
        name: "Nasi Goreng",
        price: 20000,
        discount: "20%",
        img: "https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&q=80&w=500",
        category: "MochiFood",
        desc: "Nasi goreng spesial dengan bumbu rempah pilihan, potongan ayam, dan telur mata sapi lezat.",
        reviews: [
          { name: "Karina", comment: "Enak banget, packing rapi!", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" },
          { name: "Dewi", comment: "Nasi goreng rasa rempah nikmat!", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&q=80&w=100" }
        ]
      },
      {
        id: 3,
        name: "Es Krim Mochi",
        price: 15000,
        discount: "15%",
        img: "https://images.unsplash.com/photo-1563805042-7684c019e1cb?auto=format&fit=crop&q=80&w=500",
        category: "MochiFood",
        desc: "Kue mochi kenyal lembut berisi es krim manis rasa strawberry dan cokelat yang menyegarkan.",
        reviews: [
          { name: "Siti", comment: "Mochinya benar-benar kenyal, es krim di dalamnya lembut!", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&q=80&w=100" },
          { name: "Bella", comment: "Manisnya pas dan segar banget.", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=100" }
        ]
      },
      {
        id: 4,
        name: "Cardigan Pink",
        price: 89000,
        discount: "40%",
        img: "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&q=80&w=500",
        category: "MochiOutfit",
        desc: "Cardigan rajut warna pink bergaya Korea dengan bahan adem dan nyaman digunakan seharian.",
        reviews: [
          { name: "Rindi", comment: "Ukuran pas, bahan adem", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&q=80&w=100" },
          { name: "Nabila", comment: "Warnanya pink soft cantik sekali.", avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=100" }
        ]
      }
    ];

    let state = {
      products: initialProducts,
      cart: JSON.parse(localStorage.getItem('mochiCart')) || [],
      user: JSON.parse(localStorage.getItem('mochiUser')) || null
    };

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerHTML = `<span>✨</span> <span>${msg}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function formatRupiah(num) {
      return 'Rp ' + num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    }

    /* PENCARIAN TEPAT (FIXED SEARCH) */
    function executeSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      if (!query) {
        renderProducts(state.products);
        return;
      }
      const filtered = state.products.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function renderProducts(list) {
      c
