<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MochiShop</title>
<style>
:root{--pink:#FF4DA6;--pink2:#FFE4F1;}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui;}
body{background:var(--pink2);padding-bottom:80px;}
header{background:var(--pink);color:white;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0;}
.logo{font-size:20px;font-weight:800;}
.search-wrap{display:flex;padding:12px 16px;background:var(--pink);gap:8px;}
.search-wrap input{flex:1;padding:12px;border-radius:25px;border:none;}
.search-wrap button{background:white;color:var(--pink);border:none;border-radius:25px;padding:0 20px;font-weight:700;}
.tabs{display:flex;gap:10px;padding:12px 16px;overflow-x:auto;}
.tab{padding:10px 18px;background:white;border-radius:25px;color:var(--pink);font-weight:700;}
.tab.active{background:var(--pink);color:white;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px;}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);}
.card img{width:100%;height:160px;object-fit:cover;}
.badge{position:absolute;background:var(--pink);color:white;font-size:11px;padding:4px 8px;border-radius:10px;margin:8px;font-weight:800;}
.info{padding:10px;}.price{color:var(--pink);font-weight:800;}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;border:3px solid var(--pink);}
.avatar-sm{width:32px;height:32px;border-radius:50%;object-fit:cover;margin-right:8px;}
.btn{width:100%;padding:14px;background:var(--pink);color:white;border:none;border-radius:14px;font-weight:800;}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #ddd;padding:10px 0;}
.nav-item{text-align:center;font-size:12px;color:#888;}.nav-item.active{color:var(--pink);font-weight:800;}
.page{display:none;}.page.active{display:block;}
.comment{background:var(--pink2);padding:10px;border-radius:12px;margin-top:8px;font-size:13px;display:flex;align-items:center;}
.flash{background:linear-gradient(90deg,#FF4DA6,#FF8FD9);color:white;padding:14px;text-align:center;border-radius:16px;margin:12px 16px;font-weight:900;}
</style>
</head>
<body>
<header><div class="logo">🍡 MochiShop</div></header>

<div id="home" class="page active">
  <div class="search-wrap"><input id="searchInput" placeholder="Cari..."><button onclick="search()">Cari</button></div>
  <div class="tabs">
    <div class="tab active" onclick="setTab('home',this)">Home</div>
    <div class="tab" onclick="setTab('food',this)">MochiFood</div>
    <div class="tab" onclick="setTab('outfit',this)">MochiOutfit</div>
  </div>
  <div class="flash">🎉 FLASH SALE 9.9 - DISKON UP TO 90% 🎉</div>
  <h3 style="padding:0 16px;">Rekomendasi Untuk Mochi</h3>
  <div class="grid" id="homeGrid"></div>
</div>

<div id="account" class="page">
  <div style="display:flex;gap:14px;align-items:center;padding:20px;background:var(--pink);color:white;">
    <img src="https://jyywaa.github.io/images/syera.jpg" class="avatar">
    <div><h2>Syera</h2></div>
  </div>
  <div style="padding:16px;" id="komentarList"></div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="nav('home')">Home</div>
  <div class="nav-item" onclick="nav('account')">Akun</div>
</div>

<script>
const avatars = {
  Syera:"https://jyywaa.github.io/images/syera.jpg", Niel:"https://jyywaa.github.io/images/niel.jpg",
  Karel:"https://jyywaa.github.io/images/karel.jpg", Ata:"https://jyywaa.github.io/images/ata.jpg",
  Carmen:"https://jyywaa.github.io/images/carmen.jpg", Rindi:"https://jyywaa.github.io/images/rindi.jpg",
  Karina:"https://jyywaa.github.io/images/rindi.jpg"
};
const products = [
  {id:1,nama:"Ayam Geprek",harga:18000,diskon:"18% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1606756790138-261d2b800f0b?w=400",kat:"food"},
  {id:9,nama:"Cardigan Pink",harga:120000,diskon:"20% OFF",rating:4.8,img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400",kat:"outfit"}
];
const komentar = [
  {nama:"Karina",text:"Enak banget!"},{nama:"Rindi",text:"Ukuran pas"},
  {nama:"Niel",text:"Cepat banget"},{nama:"Carmen",text:"Worth it"}
];
function render(list,target){document.getElementById(target).innerHTML=list.map(p=>`<div class="card"><span class="badge">${p.diskon}</span><img src="${p.img}"><div class="info"><div style="font-weight:700">${p.nama}</div><div class="price">Rp${p.harga.toLocaleString()}</div><div>★ ${p.rating}</div></div></div>`).join('');}
function renderKomentar(){document.getElementById('komentarList').innerHTML=komentar.map(k=>`<div class="comment"><img src="${avatars[k.nama]}" class="avatar-sm"><b>${k.nama}:</b> ${k.text}</div>`).join('');}
function init(){render(products,'homeGrid');renderKomentar();}
init();
function setTab(id,el){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
function nav(p){setTab(p);document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));event.target.classList.add('active');}
function search(){const q=document.getElementById('searchInput').value.toLowerCase();render(products.filter(p=>p.nama.toLowerCase().includes(q)),'homeGrid');}
</script>
</body>
</html>
