<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Promo</title><style>:root{--pink:#FF4DA6;--pink2:#FFE4F1}*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--pink2);padding-bottom:80px}header{background:var(--pink);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.logo{font-size:20px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.06);position:relative;cursor:pointer}
.card img{width:100%;height:160px;object-fit:cover}.badge{position:absolute;background:red;color:white;font-size:11px;padding:4px 8px;border-radius:10px;margin:8px;font-weight:800}
.info{padding:10px}.price{color:var(--pink);font-weight:800}.old{font-size:12px;text-decoration:line-through;color:#999;margin-left:4px}
.voucher-btn{width:calc(100% - 16px);margin:8px;padding:10px;background:var(--pink);color:white;border:none;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #eee;padding:12px 0}
.nav-item{text-align:center;font-size:13px;color:#888;text-decoration:none;position:relative}.badge-cart{position:absolute;top:-6px;right:8px;background:red;color:white;font-size:10px;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-weight:800;display:none}</style></head>
<body><header><div class="logo">🍡 Promo 9.9</div><button onclick="logout()" style="background:none;border:none;color:white;font-weight:700">Keluar</button></header>
<h3 style="padding:16px">Promo Spesial Hari Ini</h3><div class="grid" id="g"></div>
<div class="bottom-nav"><a href="./home.html" class="nav-item">Home</a><a href="./cart.html" class="nav-item">Keranjang<span id="cartBadge" class="badge-cart"></span></a><a href="./account.html" class="nav-item">Akun</a></div>
<script>
const products=[{id:1,nama:"Ayam Geprek",harga:18000,old:22000,diskon:"18% OFF",img:"https://images.unsplash.com/photo-1606756790138-261d2b800f0b?w=400"},{id:9,nama:"Cardigan Pink",harga:120000,old:150000,diskon:"20% OFF",img:"https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400"}];
let cart=JSON.parse(localStorage.getItem('mochiCart')||'[]');
function render(){g.innerHTML=products.map(p=>`<div class="card"><span class="badge">${p.diskon}</span><img src="${p.img}">
<button class="voucher-btn" onclick="add(${p.id})">Beli dengan Voucher</button>
<div class="info"><div style="font-weight:700">${p.nama}</div><div><span class="price">Rp${p.harga.toLocaleString()}</span> <span class="old">Rp${p.old.toLocaleString()}</span></div></div></div>`).join('')}
function add(id){cart.push(products.find(x=>x.id==id));localStorage.setItem('mochiCart',JSON.stringify(cart));badge()}
function badge(){if(cart.length>0){cartBadge.style.display='flex';cartBadge.innerText=cart.length}else{cartBadge.style.display='none'}}
function logout(){location.href='./index.html'}render();badge()
</script></body></html>
